name: Deploy Employee ETL Pipeline (CloudFormation)

on:
  push:
    branches:
      - main
    paths:
      - 'emp-etl-pipeline-v2.yaml'
      - '.github/workflows/deploy-emp-etl-pipeline.yml'
      - 'glue_job.py'
      - 'csv_files/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - delete

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: emp-etl-pipeline-v2
  TEMPLATE_FILE: emp-etl-pipeline-v2.yaml
  INPUT_BUCKET: emp-data-csv-input-v2
  OUTPUT_BUCKET: emp-data-csv-output-v2
  GLUE_SCRIPT_LOCAL_PATH: glue_job.py
  GLUE_SCRIPT_S3_KEY: scripts/glue_job.py
  CSV_LOCAL_FOLDER: csv_files
  OUTPUT_LOCAL_FOLDER: output_files

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Upload Glue ETL script to S3
        run: |
          aws s3 cp ${{ env.GLUE_SCRIPT_LOCAL_PATH }} \
            s3://${{ env.INPUT_BUCKET }}/${{ env.GLUE_SCRIPT_S3_KEY }} \
            --region ${{ env.AWS_REGION }}

      - name: Check if csv_files changed in this push
        id: csv_check
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | grep -q '^csv_files/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot existing output objects before triggering the pipeline
        if: steps.csv_check.outputs.changed == 'true'
        id: snapshot
        run: |
          aws s3 ls s3://${{ env.OUTPUT_BUCKET }}/output/ --region ${{ env.AWS_REGION }} \
            | awk '{print $4}' | sort > /tmp/before_output_files.txt || true
          echo "Existing output objects before this run:"
          cat /tmp/before_output_files.txt

      - name: Upload new CSVs to S3 input folder (triggers the pipeline)
        if: steps.csv_check.outputs.changed == 'true'
        run: |
          if [ -d "${{ env.CSV_LOCAL_FOLDER }}" ] && [ "$(ls -A ${{ env.CSV_LOCAL_FOLDER }}/*.csv 2>/dev/null)" ]; then
            aws s3 cp ${{ env.CSV_LOCAL_FOLDER }}/ \
              s3://${{ env.INPUT_BUCKET }}/input/ \
              --recursive --exclude "*" --include "*.csv" \
              --region ${{ env.AWS_REGION }}
            echo "CSV(s) uploaded — pipeline will trigger automatically via S3 event."
          else
            echo "No CSV files found in ${{ env.CSV_LOCAL_FOLDER }}/, skipping upload."
          fi

      - name: Wait for new output file to appear in S3
        if: steps.csv_check.outputs.changed == 'true'
        id: wait_output
        run: |
          NEW_FILE=""
          for i in $(seq 1 30); do
            aws s3 ls s3://${{ env.OUTPUT_BUCKET }}/output/ --region ${{ env.AWS_REGION }} \
              | awk '{print $4}' | sort > /tmp/after_output_files.txt || true
            NEW_FILE=$(comm -13 /tmp/before_output_files.txt /tmp/after_output_files.txt | head -n 1)
            if [ -n "$NEW_FILE" ]; then
              echo "New output file detected: $NEW_FILE"
              echo "new_file=$NEW_FILE" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Attempt $i/30: no new output file yet, waiting 20s (job + crawler still running)..."
            sleep 20
          done
          if [ -z "$NEW_FILE" ]; then
            echo "::warning::No new output file appeared within the wait window. The Glue job/crawler may still be running or may have failed — check the AWS Glue console."
          fi

      - name: Download new output file from S3
        if: steps.csv_check.outputs.changed == 'true' && steps.wait_output.outputs.new_file != ''
        run: |
          mkdir -p ${{ env.OUTPUT_LOCAL_FOLDER }}
          aws s3 cp \
            s3://${{ env.OUTPUT_BUCKET }}/output/${{ steps.wait_output.outputs.new_file }} \
            ${{ env.OUTPUT_LOCAL_FOLDER }}/${{ steps.wait_output.outputs.new_file }} \
            --region ${{ env.AWS_REGION }}

      - name: Commit and push output file back to repo
        if: steps.csv_check.outputs.changed == 'true' && steps.wait_output.outputs.new_file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.OUTPUT_LOCAL_FOLDER }}/${{ steps.wait_output.outputs.new_file }}
          git commit -m "Add pipeline output: ${{ steps.wait_output.outputs.new_file }} [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table

  delete:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empty S3 buckets before deleting stack
        run: |
          echo "Emptying input bucket (if it exists)..."
          aws s3 rm s3://${{ env.INPUT_BUCKET }} --recursive --region ${{ env.AWS_REGION }} || true
          echo "Emptying output bucket (if it exists)..."
          aws s3 rm s3://${{ env.OUTPUT_BUCKET }} --recursive --region ${{ env.AWS_REGION }} || true

      - name: Delete CloudFormation stack
        run: |
          aws cloudformation delete-stack \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for stack deletion to complete
        run: |
          aws cloudformation wait stack-delete-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}
