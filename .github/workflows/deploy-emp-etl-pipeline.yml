name: Deploy Employee ETL Pipeline (CloudFormation)

on:
  push:
    branches:
      - main
    paths:
      - 'emp-etl-pipeline-v2.yaml'
      - '.github/workflows/deploy-emp-etl-pipeline.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - delete

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: emp-etl-pipeline-v2
  TEMPLATE_FILE: emp-etl-pipeline-v2.yaml
  INPUT_BUCKET: emp-data-csv-input-v2
  GLUE_SCRIPT_LOCAL_PATH: glue_job.py
  GLUE_SCRIPT_S3_KEY: scripts/glue_job.py

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Upload Glue ETL script to S3
        run: |
          aws s3 cp ${{ env.GLUE_SCRIPT_LOCAL_PATH }} \
            s3://${{ env.INPUT_BUCKET }}/${{ env.GLUE_SCRIPT_S3_KEY }} \
            --region ${{ env.AWS_REGION }}

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table

  delete:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete CloudFormation stack
        run: |
          aws cloudformation delete-stack \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for stack deletion to complete
        run: |
          aws cloudformation wait stack-delete-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}
